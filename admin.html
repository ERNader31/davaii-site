<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت — سایت مجید دوایی</title>
<style>
:root{--bg:#141110;--surface:#1E1A16;--ink:#F2EDE6;--muted:#A79C8E;--line:#2E2822;--accent:#E05A4E}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma,Vazirmatn,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 16px}
h1{font-size:20px;margin-bottom:6px}
p.sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(480px,100%);margin-bottom:18px}
.card h2{font-size:15px;margin-bottom:14px}
.preview{width:140px;height:140px;object-fit:cover;border-radius:12px;border:3px solid var(--line);margin:0 auto 16px;display:block}
.preview.round{border-radius:50%}
.filebox{display:flex;flex-direction:column;gap:8px;align-items:center}
input[type=file]{display:none}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 22px;font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:hover{opacity:.9}
.shapes{display:flex;gap:10px;justify-content:center;margin-top:14px}
.shapes button{font-family:inherit;font-size:13px;font-weight:bold;padding:10px 18px;border-radius:10px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.shapes button.on{border-color:var(--accent);color:var(--accent);background:rgba(224,90,78,.1)}
.status{margin-top:14px;text-align:center;font-size:13px;color:var(--muted);min-height:20px}
.status.ok{color:#6BCB77}
.status.err{color:#FF6B6B}
.link{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.link a{color:var(--accent)}
</style>
</head>

  <div class="filebox">
    <label class="btn ghost" for="file">📁 انتخاب عکس جدید</label>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
    <button class="btn" id="saveBtn" disabled>ذخیره تغییرات</button>
  </div>
</div>

<div class="card">
  <h2>شکل قاب</h2>
  <div class="shapes">
    <button id="shapeSquare" class="on">مربع (گوشه‌گرد)</button>
    <button id="shapeCircle">دایره</button>
  </div>
</div>

<div class="status" id="status"></div>
<p class="link">پس از ذخیره، تغییرات روی سایت اعمال می‌شود. <a href="/">← بازگشت به سایت</a></p>

<script>
const preview=document.getElementById('preview'),file=document.getElementById('file'),
      saveBtn=document.getElementById('saveBtn'),status=document.getElementById('status'),
      shapeSquare=document.getElementById('shapeSquare'),shapeCircle=document.getElementById('shapeCircle');
let newImageData=null, shape=localStorage.getItem('portraitShape')||'square';

function applyShape(s){
  shape=s;
  localStorage.setItem('portraitShape',s);
  preview.classList.toggle('round',s==='circle');
  shapeSquare.classList.toggle('on',s==='square');
  shapeCircle.classList.toggle('on',s==='circle');
  // live-apply on the main site
  try{sessionStorage.setItem('portraitShape',s)}catch(e){}
}
shapeSquare.onclick=()=>{applyShape('square');status.textContent='شکل قاب: مربع';status.className='status ok';};
shapeCircle.onclick=()=>{applyShape('circle');status.textContent='شکل قاب: دایره';status.className='status ok';};
applyShape(shape);

file.addEventListener('change',()=>{
  const f=file.files[0];
  if(!f){saveBtn.disabled=true;return}
  if(f.size>4*1024*1024){setStatus('حجم عکس باید کمتر از ۴ مگابایت باشد.','err');return}
  const rd=new FileReader();
  rd.onload=e=>{
    newImageData=e.target.result;
    preview.src=newImageData;
    saveBtn.disabled=false;
    setStatus('عکس آماده ذخیره است.','ok');
  };
  rd.readAsDataURL(f);
});

function setStatus(t,cls){status.textContent=t;status.className='status '+(cls||'')}

saveBtn.addEventListener('click',async()=>{
  if(!newImageData){setStatus('اول عکسی انتخاب کن.','err');return}
  saveBtn.disabled=true;
  setStatus('در حال ذخیره...','');
  try{
    const res=await fetch('/api/admin/portrait',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({image:newImageData,shape})});
    if(!res.ok)throw new Error('http '+res.status);
    const j=await res.json();
    if(j.ok){setStatus('✅ عکس با موفقیت ذخیره شد و سایت آپدیت شد.','ok')}
    else throw new Error(j.error||'unknown');
  }catch(e){
    setStatus('ذخیره ناموفق — این پنل فقط روی نسخه ورکر کار می‌کند: '+e.message,'err');
  }
  saveBtn.disabled=false;
});
</script>
</body>
</html>
