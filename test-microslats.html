<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>MicroSlats render test</title>
<style>
  html,body{margin:0;height:100%;background:#FAF9F6;color:#171310}
  html[data-theme="dark"],html[data-theme="dark"] body{background:#171310;color:#FAF9F6}
  #acid{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .content{position:relative;z-index:1;padding:24px;font-family:sans-serif}
  button{padding:8px 16px}
</style>
</head>
<body>
<canvas id="acid"></canvas>
<div class="content">
  <h1>سلام — MicroSlats render test</h1>
  <button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark'">Toggle theme</button>
  <p id="status">running…</p>
</div>
<script src="acid-microslats.js"></script>
<script>
  window.addEventListener('error',e=>{document.getElementById('status').textContent='ERROR: '+e.message});
  setTimeout(()=>{
    const s=document.getElementById('status');
    if(s.textContent.indexOf('ERROR')===-1)s.textContent='no errors after 2.5s';
  },2500);
</script>
</body>
</html>
